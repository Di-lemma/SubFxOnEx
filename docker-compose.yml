services:
  effect-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: effect-extractor
    working_dir: /app
    environment:
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.3}
      ZAI_THINKING: ${ZAI_THINKING:-enabled}
      ZAI_REASONING_EFFORT: ${ZAI_REASONING_EFFORT:-low}
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
      MONGO_DB: ${MONGO_DB:-tripindex}
      MONGO_SOURCE_COLLECTION: ${MONGO_SOURCE_COLLECTION:-erowid-clean}
      MONGO_TARGET_COLLECTION: ${MONGO_TARGET_COLLECTION:-erowid-effects-1}
      BATCH_SIZE: ${BATCH_SIZE:-10}
      SOURCE_SCAN_BATCH_SIZE: ${SOURCE_SCAN_BATCH_SIZE:-50}
      DRY_RUN: ${DRY_RUN:-false}
      INTER_DOCUMENT_DELAY_SECONDS: ${INTER_DOCUMENT_DELAY_SECONDS:-0.5}
      MAX_COMPLETION_TOKENS: ${MAX_COMPLETION_TOKENS:-12000}
      MAX_TAGS_PER_PAYLOAD: ${MAX_TAGS_PER_PAYLOAD:-40}
      MAX_REPORT_TEXT_CHARS: ${MAX_REPORT_TEXT_CHARS:-4000}
      REPORT_CHUNK_SIZE_CHARS: ${REPORT_CHUNK_SIZE_CHARS:-4000}
      REPORT_CHUNK_OVERLAP_CHARS: ${REPORT_CHUNK_OVERLAP_CHARS:-600}
      MIN_RETRY_CHUNK_SIZE_CHARS: ${MIN_RETRY_CHUNK_SIZE_CHARS:-1200}
      MAX_TEXT_DETAIL_CHARS: ${MAX_TEXT_DETAIL_CHARS:-180}
      MAX_ATTRIBUTION_NOTE_CHARS: ${MAX_ATTRIBUTION_NOTE_CHARS:-180}
      MIN_TAG_CONFIDENCE: ${MIN_TAG_CONFIDENCE:-0}
      REQUIRE_GROUNDED_EVIDENCE: ${REQUIRE_GROUNDED_EVIDENCE:-true}
      ENABLE_SEMANTIC_GUARDS: ${ENABLE_SEMANTIC_GUARDS:-true}
      ALLOW_BROAD_FALLBACK_EFFECTS: ${ALLOW_BROAD_FALLBACK_EFFECTS:-false}
      API_MAX_RETRIES: ${API_MAX_RETRIES:-5}
      API_RETRY_BASE_SECONDS: ${API_RETRY_BASE_SECONDS:-2}
      API_RETRY_MAX_SECONDS: ${API_RETRY_MAX_SECONDS:-60}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-300}
      ERROR_MAX_ATTEMPTS: ${ERROR_MAX_ATTEMPTS:-8}
      ERROR_RETRY_BASE_SECONDS: ${ERROR_RETRY_BASE_SECONDS:-300}
      ERROR_RETRY_MAX_SECONDS: ${ERROR_RETRY_MAX_SECONDS:-21600}
      PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-14400}
      STALE_POLICY: ${STALE_POLICY:-none}
      REPROCESS_UNVERSIONED: ${REPROCESS_UNVERSIONED:-false}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
